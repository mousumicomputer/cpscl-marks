<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CPSCL - Marks Entry Portal</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Tiro+Bangla&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --primary-light: #ecfdf5;
            --primary-border: #a7f3d0;
            --bg-body: #f4fbf7;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Tiro Bangla', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
        }

        input, select, textarea {
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        body {
            background-color: var(--bg-body);
            padding-bottom: 95px;
            color: #0f172a;
        }

        .icon-svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            display: inline-block;
            vertical-align: -2px;
        }

        /* হালকা সবুজ কর্পোরেট হেডার */
        .app-header {
            background: linear-gradient(135deg, #064e3b, #059669);
            color: white;
            padding: 16px 14px 14px 14px;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.15);
            text-align: center;
        }

        .school-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 50%;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            margin-bottom: 6px;
        }

        .exam-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 3px 14px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-top: 4px;
        }

        .card-custom {
            background: #ffffff;
            border: 1.5px solid #d1fae5;
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(5, 150, 105, 0.03);
        }

        .student-row-card {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            padding: 9px 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: 0.15s ease;
        }

        .student-row-card:focus-within {
            border-color: var(--primary);
            background-color: #f0fdf4;
            box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.1);
        }

        .student-row-card.hidden { display: none !important; }

        .sl-badge {
            background-color: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.82rem;
            min-width: 38px;
            text-align: center;
            border: 1px solid var(--primary-border);
        }

        .student-title {
            font-size: 0.90rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .student-sub {
            font-size: 0.74rem;
            color: #64748b;
        }

        .mark-input {
            width: 72px;
            height: 42px;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary-dark);
            outline: none;
            background: #ffffff;
            flex-shrink: 0;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .mark-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.18);
        }

        .mark-input.input-error {
            border-color: #dc2626 !important;
            background-color: #fee2e2 !important;
            color: #dc2626 !important;
        }

        .mark-input:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            border-color: #e2e8f0;
        }

        .pin-box {
            max-width: 170px;
            letter-spacing: 6px;
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
            border-radius: 14px;
            border: 2px solid var(--primary);
        }

        .fixed-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            box-shadow: 0 -3px 12px rgba(0,0,0,0.06);
            z-index: 1000;
        }

        .save-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 11px;
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 3px 10px rgba(5, 150, 105, 0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .save-btn:active {
            background-color: var(--primary-dark);
            transform: scale(0.98);
        }
        .save-btn:disabled {
            background-color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        .search-wrap {
            position: relative;
            margin-bottom: 8px;
        }
        .search-wrap .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .search-inp {
            width: 100%;
            padding: 8px 12px 8px 34px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
        }
        .search-inp:focus { border-color: var(--primary); }

        .rule-note {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #92400e;
            margin-bottom: 8px;
        }

        .locked-alert {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .btn-soft-pill {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: 1px solid var(--primary-border);
            border-radius: 50px;
            padding: 3px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <!-- হেডার -->
    <div class="app-header mb-3">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg-795xmOcuKYH8wjija8JrA-qVjfOp_4KieeZ1pOQJaqX2uXsqGLMo09AXsGGsfGjH9LpK5fPlUNGbebFguiAzPC_YvbRXcHePj7cORQd6GMxDUg-LCeXtmNkccGI2K4Hv73PJqJkGX0Ju9N4knQuqKOAImqB6qy_WWFXpKeIaQhRgk7YbLqBLpCmL0cio/s1600/%E0%A6%95%E0%A7%8D%E0%A6%AF%E0%A6%AA%E0%A6%BE%E0%A6%A8%E0%A7%8D%E0%A6%9F%E0%A6%A8%E0%A6%AE%E0%A7%87%E0%A6%A8%E0%A7%8D%E0%A6%9F_%E0%A6%AA%E0%A6%BE%E0%A6%AC%E0%A6%B2%E0%A6%BF%E0%A6%95_%E0%A6%B8%E0%A7%8D%E0%A6%9F%E0%A7%81%E0%A6%B2_%E0%A6%93_%E0%A6%95%E0%A6%B2%E0%A7%87%E0%A6%9C_%E0%A6%B2%E0%A6%BE%E0%A6%B2%E0%A6%AE%E0%A6%A8%E0%A6%BF%E0%A6%B0%E0%A6%B9%E0%A6%BE%E0%A6%9F%E0%A7%87%E0%A6%B0_%E0%A6%B2%E0%A7%8B%E0%A6%97%E0%A7%8B.png" alt="CPSCL Logo" class="school-logo">
        <h6 class="mb-0 fw-bold" style="font-size: 0.95rem;">Cantonment Public School & College Lalmonirhat</h6>
        <div class="exam-badge" id="liveExamName">Connecting Cloud...</div>
    </div>

    <div class="container" style="max-width: 480px;">

        <!-- লক অ্যালার্ট -->
        <div id="examLockedAlert" class="locked-alert" style="display:none;">
            <svg class="icon-svg me-1" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            Entry Closed by Admin
        </div>

        <!-- পরীক্ষা, গ্রুপ ও সাবজেক্ট সিলেকশন কার্ড -->
        <div class="card-custom">
            <!-- ১. পরীক্ষা নির্বাচন ড্রপডাউন -->
            <div class="mb-2">
                <label class="form-label small fw-bold text-muted mb-1 d-flex align-items-center gap-1">
                    <svg class="icon-svg" style="fill: var(--primary);" viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
                    Select Examination
                </label>
                <select class="form-select form-select-sm fw-bold" id="examSelect" onchange="onExamChanged()" style="border: 1.5px solid var(--primary); color: var(--primary-dark); border-radius: 8px;">
                    <option value="">-- Loading Exams from Cloud --</option>
                </select>
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label small fw-bold text-muted mb-1">Group / Section</label>
                    <select class="form-select form-select-sm" id="groupSelect" onchange="onGroupChanged()">
                        <option value="">-- Select Group --</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label small fw-bold text-muted mb-1">Subject</label>
                    <select class="form-select form-select-sm" id="subjectSelect" onchange="onSubjectSelected()">
                        <option value="">-- Select Subject --</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- পিন কার্ড -->
        <div id="pinCard" class="card-custom text-center p-4" style="display: none;">
            <div id="setPinView" style="display: none;">
                <div class="mb-2">
                    <svg class="icon-svg" style="width: 38px; height: 38px; fill: #d97706;" viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                </div>
                <h6 class="fw-bold text-dark mb-1">Set 4-Digit Secret PIN</h6>
                <p class="small text-muted mb-3">No PIN set for this subject. Enter a 4-digit PIN:</p>
                <input type="password" id="newPin" class="form-control pin-box mx-auto mb-3" maxlength="4" placeholder="••••" inputmode="numeric">
                <button type="button" class="btn btn-success w-100 rounded-pill fw-bold" style="background: var(--primary); border: none;" onclick="saveNewPin()">Save PIN & Open</button>
            </div>

            <div id="enterPinView" style="display: none;">
                <div class="mb-2">
                    <svg class="icon-svg" style="width: 38px; height: 38px; fill: var(--primary);" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                </div>
                <h6 class="fw-bold text-dark mb-1">Subject PIN Protected</h6>
                <p class="small text-muted mb-3">Enter the 4-digit PIN for this subject:</p>
                <input type="password" id="inputPin" class="form-control pin-box mx-auto mb-2" maxlength="4" placeholder="••••" inputmode="numeric">
                <div id="pinError" class="text-danger small mb-2 fw-bold" style="display: none;">Incorrect PIN! Try again.</div>
                <button type="button" class="btn btn-success w-100 rounded-pill fw-bold" style="background: var(--primary); border: none;" onclick="verifyPin()">Unlock Entry</button>
            </div>
        </div>

        <!-- নম্বর এন্ট্রি সেকশন -->
        <div id="entrySection" style="display: none;">
            <div class="rule-note d-flex align-items-center justify-content-between">
                <div>
                    <svg class="icon-svg me-1" style="fill: #92400e;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    Absent/Zero = <strong>0</strong> | Full Mark: <strong id="maxMarkDisplay">30</strong>
                </div>
                <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2 fw-bold d-inline-flex align-items-center gap-1" onclick="clearScreenMarks()" id="clearAllBtn" style="font-size:0.75rem;">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    Reset
                </button>
            </div>

            <div class="search-wrap">
                <span class="search-icon">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </span>
                <input type="text" id="studentSearchInp" class="search-inp" placeholder="Search ID, Name or Roll..." oninput="filterStudentsOnTheFly()">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                <span class="badge rounded-pill px-3 py-2" id="statusBadge" style="background: var(--primary-light); color: var(--primary-dark); border: 1px solid var(--primary-border);">Active</span>
                <button type="button" class="btn-soft-pill" onclick="lockCurrentSubject()">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    Lock
                </button>
            </div>

            <form id="marksForm" onsubmit="event.preventDefault(); saveAllMarks();">
                <div id="studentsContainer"></div>

                <div class="fixed-bottom-bar text-center">
                    <button type="submit" class="save-btn" id="saveBtnEl">
                        <svg class="icon-svg" style="fill:white;" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                        Save Marks
                    </button>
                </div>
            </form>
        </div>

    </div>

    <!-- Firebase SDK v10 (Pure Cloud Connection) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1PhRiTkICNCd8sA4he3ZxKjHtIzM0d5E",
            authDomain: "mousumi-computer.firebaseapp.com",
            databaseURL: "https://mousumi-computer-default-rtdb.firebaseio.com",
            projectId: "mousumi-computer",
            storageBucket: "mousumi-computer.firebasestorage.app",
            messagingSenderId: "104820462623",
            appId: "1:104820462623:web:e3abae9533cc841463712a",
            measurementId: "G-EPYJ70W97Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        signInAnonymously(auth).catch(() => {});

        // পুরোনো মডিউলের ফিক্সড বিষয়ের তালিকা
        const LEGACY_SUBJECTS = {
            Science: [
                { key: 'B1', name: 'Bangla 1st' }, { key: 'B2', name: 'Bangla 2nd' },
                { key: 'E1', name: 'English 1st' }, { key: 'E2', name: 'English 2nd' },
                { key: 'Math', name: 'General Math' }, { key: 'HM_AG', name: 'HM/AG' },
                { key: 'Phy', name: 'Physics' }, { key: 'Che', name: 'Chemistry' },
                { key: 'Bio', name: 'Biology' }, { key: 'BGS', name: 'BGS' },
                { key: 'Reli', name: 'Religion' }, { key: 'ICT', name: 'ICT' }
            ],
            Humanities: [
                { key: 'B1', name: 'Bangla 1st' }, { key: 'B2', name: 'Bangla 2nd' },
                { key: 'E1', name: 'English 1st' }, { key: 'E2', name: 'English 2nd' },
                { key: 'Math', name: 'General Math' }, { key: 'AG_HE', name: 'AG/HE' },
                { key: 'His', name: 'History' }, { key: 'Geo', name: 'Geography' },
                { key: 'Civ', name: 'Civics' }, { key: 'Sci', name: 'General Science' },
                { key: 'Reli', name: 'Religion' }, { key: 'ICT', name: 'ICT' }
            ],
            BStudies: [
                { key: 'B1', name: 'Bangla 1st' }, { key: 'B2', name: 'Bangla 2nd' },
                { key: 'E1', name: 'English 1st' }, { key: 'E2', name: 'English 2nd' },
                { key: 'Math', name: 'General Math' }, { key: 'AG_HE', name: 'AG/HE' },
                { key: 'Fin', name: 'Finance' }, { key: 'Acc', name: 'Accounting' },
                { key: 'BE', name: 'Business Ent.' },
                { key: 'Sci', name: 'General Science' }, { key: 'Reli', name: 'Religion' },
                { key: 'ICT', name: 'ICT' }
            ]
        };

        let loadedExamsList = [];
        let currentExam = null;
        let isLegacyExam = false;
        let currentGroup = "";
        let currentSubject = "";
        let maxMarkAllowed = 15;
        let isExamLocked = false;
        let storedPIN = null;

        // ১. ক্লাউড ফায়ারবেস থেকে সব পরীক্ষা লাইভ লোড করা
        async function fetchAllExamsDirectlyFromFirebase() {
            const examSelect = document.getElementById('examSelect');
            examSelect.innerHTML = '<option value="">-- Select Examination --</option>';
            loadedExamsList = [];

            try {
                // পুরোনো সিস্টেমের পরীক্ষা লোড
                const legActiveSnap = await get(ref(db, 'evaluation_system/active_exam_id'));
                let legacyActiveId = legActiveSnap.exists() ? legActiveSnap.val() : "exam_fn02_2026";

                const legSnap = await get(ref(db, 'evaluation_system/exams'));
                if (legSnap.exists()) {
                    const legExams = legSnap.val();
                    Object.keys(legExams).forEach(k => {
                        const ex = legExams[k];
                        loadedExamsList.push({
                            type: 'legacy',
                            id: k,
                            name: `${ex.title || k} (Legacy Running)`,
                            date: ex.date || '',
                            max: parseFloat(ex.max) || 15,
                            isLocked: ex.isLocked === true,
                            activeSubjects: ex.activeSubjects || null
                        });
                    });
                } else {
                    loadedExamsList.push({
                        type: 'legacy',
                        id: legacyActiveId,
                        name: `Scholarship Assessment (Legacy)`,
                        max: 15,
                        isLocked: false
                    });
                }

                // নতুন CPSCL ERP-এর পরীক্ষা লাইভ লোড
                const newSnap = await get(ref(db, 'cpscl_exams'));
                if (newSnap.exists()) {
                    const newExams = newSnap.val();
                    const examArr = Array.isArray(newExams) ? newExams : Object.values(newExams);
                    examArr.forEach(ex => {
                        loadedExamsList.push({
                            type: 'cpscl',
                            id: ex.id,
                            name: `${ex.name} (${ex.class || 'CPSCL'})`,
                            class: ex.class || '',
                            date: ex.date || '',
                            subjects: ex.subjects || {},
                            groups: ex.groups || [],
                            isLocked: ex.status === 'Locked'
                        });
                    });
                }

                // ড্রপডাউনে পপুলেট
                loadedExamsList.forEach((ex, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.innerText = ex.name;
                    examSelect.appendChild(opt);
                });

                if (loadedExamsList.length > 0) {
                    examSelect.value = 0;
                    window.onExamChanged();
                }

            } catch (err) {
                console.error("Cloud Exams fetch error:", err);
                examSelect.innerHTML = '<option value="">Error connecting cloud database</option>';
            }
        }
        fetchAllExamsDirectlyFromFirebase();

        // ২. পরীক্ষা নির্বাচন পরিবর্তন হ্যান্ডলার
        window.onExamChanged = function () {
            const examSelect = document.getElementById('examSelect');
            const selectedIdx = examSelect.value;

            document.getElementById('pinCard').style.display = 'none';
            document.getElementById('entrySection').style.display = 'none';

            if (selectedIdx === "") return;

            currentExam = loadedExamsList[parseInt(selectedIdx)];
            isLegacyExam = (currentExam.type === 'legacy');

            document.getElementById('liveExamName').innerText = currentExam.name;
            isExamLocked = currentExam.isLocked === true;

            const lockAlert = document.getElementById('examLockedAlert');
            if (lockAlert) lockAlert.style.display = isExamLocked ? 'block' : 'none';

            populateGroupsDropdown();
        };

        // ৩. গ্রুপ ড্রপডাউন পপুলেট
        function populateGroupsDropdown() {
            const grpSelect = document.getElementById('groupSelect');
            grpSelect.innerHTML = '<option value="">-- Select Group --</option>';

            const subSelect = document.getElementById('subjectSelect');
            subSelect.innerHTML = '<option value="">-- Select Subject --</option>';

            if (!currentExam) return;

            if (isLegacyExam) {
                grpSelect.innerHTML += `
                    <option value="Group-A">Science (Group-A)</option>
                    <option value="Group-B">Science (Group-B)</option>
                    <option value="Group-C">Science (Group-C)</option>
                    <option value="Humanities">Humanities</option>
                    <option value="B.Studies">Business Studies</option>
                `;
            } else {
                const grpList = (currentExam.groups && currentExam.groups.length > 0) 
                    ? currentExam.groups 
                    : [{ name: 'Group A' }, { name: 'Group B' }];

                grpList.forEach(g => {
                    grpSelect.innerHTML += `<option value="${g.name}">${g.name}</option>`;
                });
            }
        }

        // ৪. গ্রুপ নির্বাচন পরিবর্তন হ্যান্ডলার
        window.onGroupChanged = function () {
            currentGroup = document.getElementById('groupSelect').value;
            const subSelect = document.getElementById('subjectSelect');
            subSelect.innerHTML = '<option value="">-- Select Subject --</option>';

            document.getElementById('pinCard').style.display = 'none';
            document.getElementById('entrySection').style.display = 'none';

            if (!currentGroup || !currentExam) return;

            if (isLegacyExam) {
                let streamKey = "Science";
                if (currentGroup === 'Humanities') streamKey = "Humanities";
                else if (currentGroup === 'B.Studies') streamKey = "BStudies";

                let subs = LEGACY_SUBJECTS[streamKey] || [];
                if (currentExam.activeSubjects && currentExam.activeSubjects.length > 0) {
                    subs = subs.filter(s => currentExam.activeSubjects.includes(s.key));
                }

                subs.forEach(s => {
                    subSelect.innerHTML += `<option value="${s.key}" data-max="${currentExam.max || 15}">${s.name} (${s.key})</option>`;
                });
            } else {
                const subs = currentExam.subjects || {};
                Object.keys(subs).forEach(subName => {
                    const fullM = subs[subName] || 30;
                    subSelect.innerHTML += `<option value="${subName}" data-max="${fullM}">${subName} (Full: ${fullM})</option>`;
                });
            }
        };

        // পিন ক্লাউড পাথ (evaluation_system/pins এর অধীনে সংরক্ষিত)
        function getPinCloudPath() {
            if (isLegacyExam) {
                let stream = "Science";
                if (currentGroup === 'Humanities') stream = "Humanities";
                else if (currentGroup === 'B.Studies') stream = "BStudies";
                return `evaluation_system/pins/${stream}_${currentSubject}`;
            } else {
                const cleanSub = currentSubject.replace(/[^a-zA-Z0-9_-]/g, '_');
                const cleanExam = String(currentExam.id).replace(/[^a-zA-Z0-9_-]/g, '_');
                return `evaluation_system/pins/cpscl_${cleanExam}_${cleanSub}`;
            }
        }

        // ৫. বিষয় নির্বাচন ও পিন চেক
        window.onSubjectSelected = async function () {
            const subSelect = document.getElementById('subjectSelect');
            currentSubject = subSelect.value;

            const pinCard = document.getElementById('pinCard');
            const setPinView = document.getElementById('setPinView');
            const enterPinView = document.getElementById('enterPinView');
            const pinError = document.getElementById('pinError');

            pinError.style.display = 'none';
            document.getElementById('newPin').value = '';
            document.getElementById('inputPin').value = '';
            document.getElementById('entrySection').style.display = 'none';

            if (!currentSubject || !currentGroup) {
                pinCard.style.display = 'none';
                return;
            }

            const opt = subSelect.options[subSelect.selectedIndex];
            maxMarkAllowed = opt ? parseFloat(opt.getAttribute('data-max')) || 15 : 15;
            document.getElementById('maxMarkDisplay').innerText = maxMarkAllowed;

            pinCard.style.display = 'block';

            try {
                let pSnap = await get(ref(db, getPinCloudPath()));
                if (!pSnap.exists() && isLegacyExam) {
                    pSnap = await get(ref(db, `evaluation_system/pins/${currentSubject}`));
                }

                if (pSnap.exists() && pSnap.val()) {
                    storedPIN = String(pSnap.val()).trim();
                    setPinView.style.display = 'none';
                    enterPinView.style.display = 'block';
                } else {
                    storedPIN = null;
                    setPinView.style.display = 'block';
                    enterPinView.style.display = 'none';
                }
            } catch(e) {
                setPinView.style.display = 'block';
                enterPinView.style.display = 'none';
            }
        };

        // পিন সেভ
        window.saveNewPin = async function () {
            const pin = document.getElementById('newPin').value.trim();
            if (pin.length !== 4 || isNaN(pin)) {
                alert("Please enter a 4-digit numeric PIN!");
                return;
            }

            storedPIN = pin;
            try {
                await set(ref(db, getPinCloudPath()), pin);
                document.getElementById('pinCard').style.display = 'none';
                document.getElementById('entrySection').style.display = 'block';
                renderStudentsLiveFromCloud();
            } catch (e) {
                alert("Failed to save PIN in cloud: " + e.message);
            }
        };

        // পিন ভেরিফিকেশন
        window.verifyPin = function () {
            const inputVal = document.getElementById('inputPin').value.trim();
            const pinError = document.getElementById('pinError');

            if (storedPIN && inputVal === storedPIN) {
                pinError.style.display = 'none';
                document.getElementById('pinCard').style.display = 'none';
                document.getElementById('entrySection').style.display = 'block';
                renderStudentsLiveFromCloud();
            } else {
                pinError.style.display = 'block';
                document.getElementById('inputPin').value = '';
            }
        };

        // ৬. ফায়ারবেস থেকে সরাসরি লাইভ শিক্ষার্থী ও নম্বর লোড
        async function renderStudentsLiveFromCloud() {
            document.getElementById('statusBadge').innerText = `${currentSubject} • ${currentGroup}`;
            const container = document.getElementById('studentsContainer');
            container.innerHTML = '<div class="text-center p-4 text-success"><p class="mt-2 fw-bold">Connecting Firebase Cloud...</p></div>';

            try {
                let students = [];
                let existingMarks = {};

                if (isLegacyExam) {
                    const stdSnap = await get(ref(db, 'evaluation_system/students'));
                    if (stdSnap.exists()) students = Object.values(stdSnap.val());

                    students = students.filter(s => {
                        if (currentGroup === 'Humanities') return s.group === 'Humanities';
                        if (currentGroup === 'B.Studies') return s.group === 'B.Studies';
                        const sRank = Number(s.overallRank !== undefined && s.overallRank !== null ? s.overallRank : s.sl);
                        const subGrp = s.subGroup || (sRank <= 55 ? 'Group-A' : (sRank <= 105 ? 'Group-B' : 'Group-C'));
                        return s.group === 'Science' && subGrp === currentGroup;
                    });

                    students.sort((a, b) => {
                        const rA = Number(a.overallRank !== undefined ? a.overallRank : a.sl) || 9999;
                        const rB = Number(b.overallRank !== undefined ? b.overallRank : b.sl) || 9999;
                        return rA - rB;
                    });

                    const mSnap = await get(ref(db, `evaluation_system/marks/${currentExam.id}`));
                    if (mSnap.exists()) existingMarks = mSnap.val() || {};

                } else {
                    const stdSnap = await get(ref(db, 'cpscl_students'));
                    if (stdSnap.exists()) students = Object.values(stdSnap.val());

                    const targetClass = String(currentExam.class || '').trim().toLowerCase();
                    students = students.filter(s => {
                        const c = String(s.class_name || s.class || '').trim().toLowerCase();
                        return c === targetClass || c.includes(targetClass) || targetClass.includes(c);
                    });

                    let overrides = {};
                    try {
                        const ovSnap = await get(ref(db, `cpscl_exam_group_overrides/${currentExam.id}`));
                        if (ovSnap.exists()) overrides = ovSnap.val() || {};
                    } catch(e) {}

                    students.sort((a, b) => {
                        const rA = parseInt(a.roll_no || a.roll) || 0;
                        const rB = parseInt(b.roll_no || b.roll) || 0;
                        if (rA && rB) return rA - rB;
                        return String(a.std_id || a.id).localeCompare(String(b.std_id || b.id));
                    });

                    const groupsList = (currentExam.groups && currentExam.groups.length > 0)
                        ? currentExam.groups
                        : [{ name: "Group A", from: 1, to: 40 }, { name: "Group B", from: 41, to: "Rest" }];

                    students.forEach((st, idx) => {
                        const sId = String(st.std_id || st.id || '').trim();
                        const sRoll = st.roll_no || st.roll || '';
                        const effectiveNum = (sRoll && !isNaN(parseInt(sRoll))) ? parseInt(sRoll) : (idx + 1);

                        let assigned = groupsList[0].name;
                        for (let g of groupsList) {
                            const fromNum = parseInt(g.from) || 1;
                            const toNum = (g.to && String(g.to).toLowerCase() === 'rest') ? 999999 : (parseInt(g.to) || 999999);
                            if (effectiveNum >= fromNum && effectiveNum <= toNum) {
                                assigned = g.name;
                                break;
                            }
                        }

                        if (overrides[sId]) assigned = overrides[sId];
                        st.computedGroup = assigned || "Group A";
                    });

                    students = students.filter(s => s.computedGroup === currentGroup);

                    const mSnap = await get(ref(db, `cpscl_exam_marks/${currentExam.id}_${currentSubject}`));
                    if (mSnap.exists()) existingMarks = mSnap.val() || {};
                }

                container.innerHTML = '';

                if (students.length === 0) {
                    container.innerHTML = `<div class="text-center p-4 text-danger fw-bold">No students found for ${currentGroup} in this class!</div>`;
                    return;
                }

                students.forEach((s, idx) => {
                    const sId = String(s.std_id || s.id || '').trim();
                    const sName = s.student_name || s.name || 'Unnamed';
                    const sRoll = s.roll_no || s.roll || (idx + 1);

                    let prevVal = '';
                    if (isLegacyExam) {
                        prevVal = (existingMarks[sId] && existingMarks[sId][currentSubject] !== undefined) ? existingMarks[sId][currentSubject] : '';
                    } else {
                        const rec = existingMarks[sId];
                        if (rec) {
                            if (typeof rec === 'object') {
                                prevVal = (rec.rawMark !== null && rec.rawMark !== undefined) ? rec.rawMark : (rec.cq !== undefined ? rec.cq : '');
                            } else {
                                prevVal = rec;
                            }
                        }
                    }

                    const row = document.createElement('div');
                    row.className = 'student-row-card';
                    row.setAttribute('data-search', `${sId} ${sName} ${sRoll}`.toLowerCase());
                    row.innerHTML = `
                        <div class="d-flex align-items-center gap-2" style="min-width: 0; flex: 1;">
                            <span class="sl-badge">#${sRoll}</span>
                            <div style="min-width: 0;">
                                <div class="student-title">${sName}</div>
                                <div class="student-sub">ID: ${sId} • Roll: ${sRoll}</div>
                            </div>
                        </div>
                        <input type="text" 
                               inputmode="decimal" 
                               class="mark-input" 
                               data-id="${sId}" 
                               value="${prevVal}" 
                               maxlength="4" 
                               placeholder="-"
                               ${isExamLocked ? 'disabled' : ''}
                               onfocus="this.select()"
                               autocomplete="off">
                    `;
                    container.appendChild(row);
                });

                bindInputValidation();

            } catch (err) {
                container.innerHTML = `<div class="text-center p-4 text-danger">Cloud Error: ${err.message}</div>`;
            }
        }

        // ইনপুট ভ্যালিডেশন
        function bindInputValidation() {
            const inputs = Array.from(document.querySelectorAll('.mark-input'));
            inputs.forEach((inp, idx) => {
                inp.addEventListener('input', function () {
                    this.value = this.value.replace(/[^0-9.]/g, '');
                    if ((this.value.match(/\./g) || []).length > 1) {
                        this.value = this.value.slice(0, -1);
                    }
                    const num = parseFloat(this.value);
                    if (!isNaN(num) && (num > maxMarkAllowed || num < 0)) {
                        this.classList.add('input-error');
                    } else {
                        this.classList.remove('input-error');
                    }
                });

                inp.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (inputs[idx + 1]) inputs[idx + 1].focus();
                    }
                });
            });
        }

        // ফায়ারবেসে ১০০% স্থায়ী সেভ
        window.saveAllMarks = async function () {
            if (isExamLocked) {
                alert("Exam is locked by Admin. Marks cannot be saved.");
                return;
            }

            const inputs = document.querySelectorAll('.mark-input');
            if (inputs.length === 0) return;

            let hasErrors = false;
            inputs.forEach(inp => {
                const num = parseFloat(inp.value.trim());
                if (!isNaN(num) && (num > maxMarkAllowed || num < 0)) hasErrors = true;
            });

            if (hasErrors) {
                alert(`Some marks exceed full mark (${maxMarkAllowed}). Please correct red fields.`);
                return;
            }

            const saveBtn = document.getElementById('saveBtnEl');
            const updates = {};
            let validCount = 0;

            inputs.forEach(inp => {
                const sId = inp.getAttribute('data-id');
                const val = inp.value.trim();

                if (val !== '') {
                    const num = parseFloat(val);
                    if (!isNaN(num) && num >= 0 && num <= maxMarkAllowed) {
                        if (isLegacyExam) {
                            updates[`evaluation_system/marks/${currentExam.id}/${sId}/${currentSubject}`] = String(num);
                        } else {
                            updates[`cpscl_exam_marks/${currentExam.id}_${currentSubject}/${sId}`] = {
                                rawMark: num,
                                cq: num,
                                mcq: 0,
                                practical: 0,
                                updatedAt: new Date().toISOString()
                            };
                        }
                        validCount++;
                    }
                }
            });

            if (Object.keys(updates).length === 0) {
                alert("কোনো নতুন বা পরিবর্তিত নম্বর পাওয়া যায়নি। দয়া করে নম্বর বসিয়ে সেভ করুন।");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = 'Saving directly to Cloud...';

            try {
                await update(ref(db), updates);
                alert(`🎉 Cloud Save Successful!\n${validCount} students updated for ${currentSubject} (${currentGroup}).`);
            } catch (err) {
                alert("Cloud save failed: " + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `
                    <svg class="icon-svg" style="fill:white;" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg> Save Marks
                `;
            }
        };

        // লাইভ সার্চ
        window.filterStudentsOnTheFly = function () {
            const query = document.getElementById('studentSearchInp').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.student-row-card');
            cards.forEach(card => {
                const text = card.getAttribute('data-search') || '';
                if (!query || text.includes(query)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        };

        window.clearScreenMarks = function () {
            if (isExamLocked) return alert("Exam is locked by Admin.");
            if (confirm(`Do you want to reset the fields on screen for ${currentSubject}?`)) {
                document.querySelectorAll('.mark-input').forEach(inp => {
                    inp.value = '';
                    inp.classList.remove('input-error');
                });
            }
        };

        window.lockCurrentSubject = function () {
            document.getElementById('entrySection').style.display = 'none';
            document.getElementById('pinCard').style.display = 'block';
            document.getElementById('inputPin').value = '';
        };
    </script>
</body>
</html>
